<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelada R10 R20</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3ecdc;--card:#fffaf0;--tx:#182c3c;--mut:#6e6a5c;--line:#e3d7bd;--pri:#b4561a;--pri2:#f6e0c8;--ok:#3f6b2a;--navy:#1f435b;--cream:#efe2c4;--warn:#9a5b0b;--warn2:#fbe9c4;--bad:#a61c1c;--bad2:#f9dcd6;--tag:#dfe8ee;--tagtx:#1f435b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a24;--card:#16263a;--tx:#efe6d2;--mut:#9ba7ae;--line:#26394d;--pri:#e07a35;--pri2:#3b2718;--ok:#86ba5f;--navy:#1f435b;--cream:#efe2c4;--warn:#f0a43a;--warn2:#3a2a0c;--bad:#f2867a;--bad2:#3d1a17;--tag:#1f3a52;--tagtx:#bcd3e3}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--navy);color:var(--cream);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--pri)}
header .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
header .brand img{height:42px;width:auto}
header h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:19px;margin:0;line-height:1;letter-spacing:.5px}
header h1 small{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-top:3px}
.slab{font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
.hero{background:var(--navy);color:var(--cream);border-radius:18px;padding:18px 16px 16px;text-align:center;margin-bottom:12px;border:3px solid var(--pri);position:relative;overflow:hidden}
.hero .hcfg{position:absolute;top:8px;left:8px;z-index:1;border:0;background:rgba(239,226,196,.14);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.hero .hauth{position:absolute;top:10px;right:10px;z-index:1}
.hero>img{width:150px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:26px;margin:8px 0 0;letter-spacing:1px}
.hero p{margin:2px 0 0;font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.8}
.hero .jtag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;background:rgba(239,226,196,.14);font-size:13px;font-weight:600}
.hero .prox{margin-top:14px;background:rgba(239,226,196,.12);border-radius:12px;padding:10px;font-size:14px}
.hero .prox b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;display:block;color:var(--hi,#f2a35e)}
.atal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.atal button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 4px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.atal button span{font-size:22px}
.card table td,.card table th{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.card table tr:last-child td{border-bottom:0}
.pg{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
.pg th,.pg td{padding:9px 0;text-align:center;border-bottom:1px solid var(--line)}
.pg thead th{font-size:11px;color:var(--mut);font-weight:700}
.pg .pg-n{width:27%;text-align:left;padding-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pg .pg-n small{display:block;font-size:9px;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.pg .pg-hj{color:var(--pri)}
.pg tr:last-child th,.pg tr:last-child td{border-bottom:0}
.dt{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.dt.ok{background:var(--ok)}.dt.is{background:transparent;border:2px solid var(--mut);width:10px;height:10px;box-sizing:border-box}.dt.dv{background:var(--bad)}.dt.av{background:var(--warn)}.dt.na{width:5px;height:5px;background:var(--line)}
.leg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
.finseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.finseg .chip{width:100%;padding:9px 4px;text-align:center;white-space:nowrap;font-size:14px}
.finseg .chip:nth-child(4){grid-column:1/-1}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.kp2 b{margin-top:0}.kp2 small{font-size:11px}
.kpsub{font-family:system-ui,sans-serif;font-size:13px;color:var(--mut);font-weight:400}
.fmt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fmt .chip{padding:8px 0;text-align:center}
.temas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tema{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:13px;text-align:left}
.tema.on{border-color:var(--pri)}
.tema i{display:flex;width:34px;height:22px;border-radius:6px;overflow:hidden;flex-shrink:0}
.tema i b{flex:1}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cores input[type=color]{height:44px;padding:4px;cursor:pointer}
.btn.big{width:100%;padding:16px;font-size:17px;margin-bottom:12px;border-radius:14px}
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pln{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);min-width:34px;font-size:16px}
.pli{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plc{display:block;font-size:11px;color:var(--mut);font-family:system-ui,sans-serif}
.plb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.plb:disabled{opacity:.3}
.plb.x{color:var(--bad)}
.filasep{background:var(--pri2);color:var(--pri);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:center;padding:4px}
.radio{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:15px;cursor:pointer}
.radio input{width:auto;margin:0 0 4px}
.radio small{color:var(--mut);font-size:12px}
.radio:has(input:checked){border-color:var(--pri);background:var(--pri2)}
.time.jogo{outline:2px solid var(--pri)}
.time .inc{font-size:11px;color:var(--bad);font-family:system-ui,sans-serif}
.dtag{font-size:10px;background:var(--warn2);color:var(--warn);border-radius:6px;padding:0 4px;font-weight:700}
.placar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;text-align:center;gap:6px}
.pl-nome{font-family:'Alfa Slab One',Georgia,serif;font-size:16px}
.pl-gols{font-family:'Alfa Slab One',Georgia,serif;font-size:58px;line-height:1.1;color:var(--pri)}
.pl-x{font-size:22px;color:var(--mut);padding-top:34px}
.pl-jog{font-size:11px;color:var(--mut);line-height:1.4}
.relogio{text-align:center}
.clk{font-family:'Alfa Slab One',Georgia,serif;font-size:54px;letter-spacing:2px;line-height:1.1}
.relogio.estourou{border-color:var(--bad);background:var(--bad2)}
.relogio.estourou .clk{color:var(--bad)}
.golbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.golbtns .btn{margin-bottom:10px;padding:16px 6px;line-height:1.3}
.golbtns small{font-size:12px;font-weight:400;opacity:.9}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cbtn{padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font-size:28px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cbtn small{font-size:12px}
.cbtn.on{border-color:var(--pri);background:var(--pri2)}
.fimjogo{text-align:center;border-color:var(--pri)}
.pen-tab{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px}
.pen-tab b{font-size:12px;color:var(--mut)}
.btn.big.bad{background:#b91c1c;color:#fff}
.valpen{margin-top:12px;padding:12px;border-radius:12px;background:var(--pri2);text-align:center;border:2px solid var(--pri)}
.lj{padding:8px 0;border-bottom:1px solid var(--line)}
.lj:last-child{border-bottom:0}
.lj1{font-size:15px}
.lj2{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 0 28px}
.sn{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--bg);border-radius:8px;padding:2px 7px}
.sn b{font-size:13px}
.sn.z{opacity:.4}
.sn.f{background:var(--pri2);color:var(--pri)}
.tj{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tj th{font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase;padding:4px 2px;border-bottom:2px solid var(--line)}
.tj td{padding:8px 2px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.tj tr:last-child td{border-bottom:0}
.tj th:first-child,.tj td:first-child{width:26px;text-align:left;font-size:11px}
.tj .tn{text-align:left;width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tj td.tn{font-size:14px}
.tj th{white-space:nowrap;overflow:hidden}
.tj td b{font-size:15px}
.tj .z{color:var(--mut);opacity:.6}
.tj tr.tsec td{text-align:left;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri2);padding:5px 8px;border-bottom:0}
.tj .tc{white-space:nowrap;padding-right:0}
.tj th:last-child,.tj td.tc{width:56px}
.kc{display:inline-flex;align-items:center;justify-content:center;width:15px;height:21px;border-radius:3px;font-size:11px;font-weight:800;margin:0 1px;box-shadow:0 1px 2px rgba(0,0,0,.4);font-family:system-ui,sans-serif;vertical-align:middle}
.kc.am{background:#facc15;color:#111}
.kc.az{background:#2563eb;color:#fff}
.kc.vm{background:#dc2626;color:#fff}
.pdt{display:block;font-size:10px;color:var(--mut)}
.dj .djw{grid-column:1/-1}
.djs{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:14px;color:var(--mut)}
.dj .djs b{display:inline;font-size:16px;color:var(--tx)}
.dj .djs span{display:inline}
.djs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dj .djs3{background:none;border-radius:0;padding:10px 0 0}
.dj .djs3 div{background:none;padding:0;border-radius:0}
.dj .djs3 b{font-size:20px}
.dj .djs3 small{font-size:11px}
.ved{display:block;font-size:10px;letter-spacing:.5px;margin-top:1px}
.ved i,.rtimes i,.vv,.ve,.vd{font-style:normal;font-weight:700}
.vv{color:var(--ok)}.ve{color:var(--mut)}.vd{color:var(--bad)}
.rtimes{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin:6px 0 8px}
.rtimes div{background:var(--bg);border-radius:10px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.testa{display:flex;align-items:center;gap:6px;margin:-4px 0 10px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.testa button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.testa button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.cxs{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut,#8aa);margin:10px 0 2px}
.cxt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:2px solid var(--line);padding-top:8px;text-align:center}.cxt small{display:block;font-size:11px;opacity:.75}.cxt b{font-size:15px}
.jcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jcol{background:var(--bg);border-radius:12px;padding:10px;border:2px solid transparent;min-width:0}
.jcol.venc{border-color:var(--ok)}
.jcol>b{display:block;margin-bottom:6px;font-size:14px}
.jl{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:13px;padding:3px 0}
.jl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl.sub{opacity:.55}.jl small{font-size:10px}
.jgk{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.tl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl:last-child{border-bottom:0}
.tl.b{flex-direction:row-reverse;text-align:right}
.tlm{color:var(--mut);font-size:12px;min-width:26px}
.tl>span:nth-child(2){flex:1}
.tlp{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);font-size:14px}
.pjseg{display:flex;gap:6px;margin-bottom:8px}.pjseg .chip{flex:1;padding:6px 10px;font-size:13px}.card .row .pjseg{margin:0;flex:0 0 auto}.card .row .pjseg .chip{flex:0 0 auto;padding:4px 10px;font-size:12px}
.tpj{width:100%;border-collapse:collapse;font-size:14px}.tpj th{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;padding:4px 6px;text-align:center}.tpj td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}.tpj .tn{text-align:left;width:100%}.tpj td.z{color:var(--mut);width:34px;text-align:left}.tpj td.on{font-weight:800;color:var(--pri);font-size:16px}.tpj th.on{color:var(--pri)}
.lids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lid{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.lid small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.lid b{display:block;font-size:17px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lid .lv{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);font-size:20px}
.dest{display:flex;align-items:center;gap:12px}
.dest .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--pri2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dest small{color:var(--mut);font-size:12px;display:block}
.dest b{font-size:16px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 12px;font-size:10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.card h3,.kpi b,.mes b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:19px;margin-top:4px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mes b{font-size:17px;text-transform:capitalize}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--pri);color:var(--onpri,#fff);cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.btn.bad{background:var(--bad2);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.list .it:last-child{border-bottom:0}
.it small{color:var(--mut);display:block;font-size:12px;margin-top:2px}
.click{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.chip i{font-style:normal;font-size:11px;opacity:.85;margin-right:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--tag);color:var(--tagtx);font-weight:600;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--pri2);color:var(--pri)}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.b{background:var(--bad2);color:var(--bad)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.step b{min-width:18px;text-align:center}
.pst{padding:10px 0;border-bottom:1px solid var(--line)}
.pst:last-child{border-bottom:0}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.stc .step{gap:2px}
.stc .step button{width:24px;height:30px;font-size:15px;padding:0}
.stc .step b{min-width:14px;font-size:14px}
.dj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dj div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.dj b{display:block;font-size:22px}
.dj small{color:var(--mut);font-size:12px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.time{border-radius:12px;padding:10px;background:var(--pri2)}
.time:nth-child(2){background:var(--tag)}
.time b{display:block;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hidden{display:none}
.dlg{z-index:30;align-items:center;padding:16px}
.dsheet{border-radius:16px;max-width:400px}
.dsheet p{margin:0 0 16px;font-size:16px;line-height:1.4}
.dsheet .row{justify-content:flex-end}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.rk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.seg{display:flex;gap:6px;margin-bottom:10px}
body.ro .adm{display:none!important}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 body{padding:0;background:#fff}
 #print{display:block;color:#000;font-family:Arial,sans-serif}
 #print table{width:100%;border-collapse:collapse}
 #print td,#print th{border:1px solid #000;padding:6px;font-size:13px}
 #print td{height:30px}
}
</style>

// papéis: 'adm' (tudo), 'juiz' (só os jogos), null (visitante, só olha)
let papel=null,isAdmin=false,isJuiz=false;
function setPapel(x){papel=x||null;isAdmin=papel==='adm';isJuiz=papel==='juiz'}
const podeJogo=()=>isAdmin||isJuiz;
// lista de chegada e sorteio: ADM sempre; juiz só enquanto a pelada está aberta
const podeLista=p=>isAdmin||(isJuiz&&!!p&&p.status!=='cancelada'&&p.status!=='fechada');

// ===== utilidades =====
const p2=n=>String(n).padStart(2,'0');
function hoje(){const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
const ym=s=>String(s).slice(0,7);
function addM(m,k){let[y,mo]=m.split('-').map(Number);mo+=k;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return `${y}-${p2(mo)}`}
function diffM(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+(mb-ma)}
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nomeMes=m=>{const[y,mo]=m.split('-');return MESES[+mo-1]+' '+y};
const nomeMesC=m=>{const[y,mo]=m.split('-');return MESES[+mo-1].slice(0,3)+'/'+y.slice(2)};
const dataBR=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const soma=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const val=id=>(document.getElementById(id)?.value||'').trim();
const temValor=id=>val(id)!==''&&!isNaN(parseFloat(val(id).replace(',','.')))&&parseFloat(val(id).replace(',','.'))>=0;
const num=id=>parseFloat(val(id).replace(',','.'))||0;
const byNome=(a,b)=>(a.apelido||a.nome).localeCompare(b.apelido||b.nome,'pt-BR',{numeric:true});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let S={tab:'inicio',mes:ym(hoje()),peladaId:null,rk:'mes',pj:'pr',fin:'geral',histAno:null,pgAno:null,sorteio:{sel:[],res:null}};

// ===== dados =====
async function buscaPapel(session){
  if(!session)return setPapel(null);
  const{data}=await sb.from('admins').select('papel').eq('user_id',session.user.id).maybeSingle();
  setPapel(data?data.papel:null);
}
async function load(){
  if(sb){
    const{data:{session}}=await sb.auth.getSession();
    await buscaPapel(session);
    const{data,error}=await sb.from('docs').select('colecao,dados');
    if(error){avisa('Erro ao carregar: '+error.message);return}
    Object.keys(DB).forEach(k=>DB[k]=[]);
    data.forEach(r=>DB[r.colecao]&&DB[r.colecao].push(r.dados));
    // times e jogos ficam num registro separado (o juiz só grava esse)
    DB.partidas.forEach(pt=>{const p=DB.peladas.find(x=>x.id===pt.pid);if(p){p.times=pt.times||[];p.jogos=pt.jogos||[];if(Array.isArray(pt.presentes))p.presentes=pt.presentes}});
  }else{
    try{const s=localStorage.getItem(LS);if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
  }
}
let semStorage=false;
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(DB));semStorage=localStorage.getItem(LS)===null}catch(e){semStorage=true}}
function testaStorage(){if(sb)return;try{localStorage.setItem('pelada_t','1');semStorage=localStorage.getItem('pelada_t')!=='1';localStorage.removeItem('pelada_t')}catch(e){semStorage=true}}
async function put(col,obj){
  const arr=DB[col];const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  if(sb){
    let erro=null;
    if(col==='peladas'){
      const{times,jogos,...base}=obj;
      if(isAdmin){const r=await sb.from('docs').upsert({id:obj.id,colecao:'peladas',dados:base});erro=r.error}
      if(!erro&&(isAdmin||isJuiz)){const r=await sb.from('docs').upsert({id:'pt_'+obj.id,colecao:'partidas',dados:{id:'pt_'+obj.id,pid:obj.id,presentes:obj.presentes||[],times:times||[],jogos:jogos||[]}});erro=r.error}
    }else if(isJuiz&&col==='jogadores'){const r=await sb.from('docs').insert({id:obj.id,colecao:col,dados:obj});erro=r.error}
    else{const r=await sb.from('docs').upsert({id:obj.id,colecao:col,dados:obj});erro=r.error}
    if(erro)avisa('Erro ao salvar: '+erro.message);
  }
  else persistLocal();
}
async function del(col,id){
  DB[col]=DB[col].filter(x=>x.id!==id);
  if(sb){const{error}=await sb.from('docs').delete().in('id',col==='peladas'?[id,'pt_'+id]:[id]);if(error)avisa('Erro ao excluir: '+error.message)}
  else persistLocal();
}

// ===== regras =====
const lastBy=(list,m)=>[...(list||[])].filter(v=>v.desde<=m).sort((a,b)=>a.desde.localeCompare(b.desde)).pop();
const cfgMes=m=>lastBy(DB.config,m)||{mensalidade:0,diaria:0,vencimento:10};
const tipoMes=(j,m)=>(lastBy(j.tipos,m)||{}).tipo||'diarista';
// mensalidade só é devida a partir da entrada; quem entra depois do vencimento começa no mês seguinte
function deveMes(j,m){
  if(!j.entrada)return true;
  const em=ym(j.entrada);
  if(m<em)return false;
  if(m===em&&+j.entrada.slice(8,10)>cfgMes(m).vencimento)return false;
  return true;
}
const jog=id=>DB.jogadores.find(j=>j.id===id);
const nomeJ=id=>{const j=jog(id);return j?(j.apelido||j.nome):'(removido)'};
const curP=()=>DB.peladas.find(p=>p.id===S.peladaId);

const diasNoMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const diaNoMes=(m,ref)=>`${m}-${p2(Math.min(+(ref||'').slice(8,10)||1,diasNoMes(m)))}`;
function despesasMes(m){
  const out=[];
  DB.despesas.forEach(d=>{
    if(d.tipo==='avista'){
      if(ym(d.data)===m)out.push({d,valor:+d.valor,dt:d.data,lab:'à vista · '+dataBR(d.data)+(d.peladaId?' · pelada':'')});
    }else if(d.tipo==='parcelada'){
      const i=diffM(ym(d.data),m);
      if(i>=0&&i<d.parcelas)out.push({d,valor:d.valor/d.parcelas,dt:diaNoMes(m,d.data),lab:`parcela ${i+1}/${d.parcelas}`});
    }else if(d.tipo==='recorrente'){
      if(m>=d.inicio&&(!d.fim||m<=d.fim)){const v=lastBy(d.vigencias,m);if(v)out.push({d,valor:+v.valor,dt:diaNoMes(m,d.cadastro),lab:'recorrente'})}
    }
  });
  return out;
}
const receitasMes=m=>DB.receitas.filter(r=>ym(r.data)===m);
function primeiroMes(){
  const ms=[...DB.receitas.map(r=>ym(r.data)),...DB.despesas.map(d=>d.tipo==='recorrente'?d.inicio:ym(d.data))];
  return ms.length?ms.sort()[0]:S.mes;
}
function saldoAte(m){
  let s=0,c=primeiroMes(),guard=0;
  while(c<=m&&guard++<600){s+=soma(receitasMes(c),r=>r.valor)-soma(despesasMes(c),x=>x.valor);c=addM(c,1)}
  return s;
}
function pendencias(m){
  const c=cfgMes(m),out=[];
  DB.jogadores.filter(j=>j.ativo!==false&&tipoMes(j,m)==='mensalista'&&deveMes(j,m)).forEach(j=>{
    const pago=DB.receitas.some(r=>r.tipo==='mensalidade'&&r.jogadorId===j.id&&r.competencia===m);
    if(!pago&&c.mensalidade>0){const venc=`${m}-${p2(c.vencimento)}`;out.push({tipo:'mensalidade',j,venc,atrasado:hoje()>venc,valor:c.mensalidade})}
  });
  DB.peladas.filter(p=>ym(p.data)===m&&p.status!=='cancelada').forEach(p=>(p.presentes||[]).forEach(id=>{
    const j=jog(id);
    if(j&&c.diaria>0&&tipoMes(j,m)==='diarista'&&!DB.receitas.some(r=>r.tipo==='diaria'&&r.peladaId===p.id&&r.jogadorId===id))
      out.push({tipo:'diaria',j,p,atrasado:true,valor:c.diaria});
  }));
  return out;
}

// quem jogou por um lado no jogo (escalação final, quem saiu substituído e os goleiros que passaram pelo gol)
function ladoJogou(j,l){
  const ev=j.ev||[],o=l==='a'?'b':'a';
  return[...new Set([...j[l].jog,j[l].gk,...ev.filter(e=>e.t==='sub'&&e.lado===l).map(e=>e.sai),...ev.filter(e=>e.t==='gol'&&e.lado===o&&e.gkSof).map(e=>e.gkSof)].filter(Boolean))];
}
// lances dos jogos -> [jogadorId, campo, quantidade]
function statsJogos(p){
  const out=[];
  (p.jogos||[]).forEach(j=>{
    const gk={a:j.a.gk,b:j.b.gk};
    new Set([...j.a.jog,...j.b.jog,...(j.ev||[]).filter(e=>e.t==='sub').map(e=>e.sai),...(j.ev||[]).filter(e=>e.t==='gol'&&e.gkSof).map(e=>e.gkSof),gk.a,gk.b].filter(Boolean)).forEach(id=>out.push([id,'jg',1]));
    (j.ev||[]).forEach(e=>{
      if(e.t==='gol'){if(e.jid&&!e.contra)out.push([e.jid,'g',1]);const sof='gkSof' in e?e.gkSof:(e.lado==='a'?gk.b:gk.a);if(sof)out.push([sof,'gs',1])}
      else if(e.t==='cartao'&&e.jid)out.push([e.jid,e.cor,1]);
    });
    ((j.pen&&j.pen.k)||[]).forEach(k=>{if(k.r==='def'){const g='gk' in k?k.gk:(k.lado==='a'?gk.b:gk.a);if(g)out.push([g,'pd',1])}});
    // vitória / empate (saíram os dois) / derrota — pênaltis decidem
    const v=vencedor(j);
    if(v){ladoJogou(j,v).forEach(id=>out.push([id,'v',1]));ladoJogou(j,v==='a'?'b':'a').forEach(id=>out.push([id,'d',1]))}
    else if(j.fim&&j.desfecho==='saem')[...ladoJogou(j,'a'),...ladoJogou(j,'b')].forEach(id=>out.push([id,'e',1]));
  });
  return out;
}
function ranking(m){
  const t={};
  DB.peladas.filter(p=>p.status!=='cancelada'&&(!m||p.data.startsWith(m))).forEach(p=>{
    (p.presentes||[]).forEach(id=>{(t[id]=t[id]||novoSt()).pr++});
    Object.entries(p.stats||{}).forEach(([id,s])=>{const x=(t[id]=t[id]||novoSt());x.g+=s.g||0;x.ca+=s.ca||0;x.cz+=s.cz||0;x.cv+=s.cv||0});
    statsJogos(p).forEach(([id,k,v])=>{const x=(t[id]=t[id]||novoSt());x[k]+=v});
  });
  return Object.entries(t).map(([id,x])=>({id,...x}));
}

 ['Preto e Branco','#171717','#d4d4d4'],['Céu','#0c4a6e','#38bdf8'],['Roxo e Laranja','#3b0764','#f97316'],['Grená e Ouro','#5b1020','#d4a017']];
const hexRgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgbHex=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const mix=(a,b,t)=>{const A=hexRgb(a),B=hexRgb(b);return rgbHex(A.map((v,i)=>v+(B[i]-v)*t))};
const tema=()=>{const t=aj().tema;return t&&t.c1?t:{nome:'Das Antigas',c1:'#1f435b',c2:'#b4561a',c2d:'#e07a35'}};

const carregaImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function trocaLogo(){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files&&i.files[0];if(!f)return;
    try{
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      const img=await carregaImg(url),M=360,k=Math.min(1,M/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let d=cv.toDataURL('image/webp',0.9);if(!d.startsWith('data:image/webp'))d=cv.toDataURL('image/png');
      await put('ajustes',{...aj(),logo:d});render();
      if(await confirma('Logo atualizado! Quer que o app pegue as cores do logo?','Pegar cores'))coresDoLogo();
    }catch(e){avisa('Não consegui abrir essa imagem. Tente um PNG ou JPG.')}
  };
  i.click();
}
async function logoOriginal(){if(!await confirma('Voltar para o logo original da pelada?'))return;const a={...aj()};delete a.logo;await put('ajustes',a);render()}
async function coresDoLogo(){
  try{
    const img=await carregaImg(logoAtual()),N=80,cv=document.createElement('canvas');cv.width=N;cv.height=N;
    const c=cv.getContext('2d');c.drawImage(img,0,0,N,N);const px=c.getImageData(0,0,N,N).data;
    const esc={},viv={};
    for(let i=0;i<px.length;i+=4){
      if(px[i+3]<200)continue;
      const r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
      if(d<0.08)continue;
      const sat=d/(1-Math.abs(2*l-1));let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(((h*60)+360)%360/20);
      const alvo=l<0.32?esc:(sat>0.35&&l<0.75?viv:null);if(!alvo)continue;
      const o=(alvo[h]=alvo[h]||{n:0,r:0,g:0,b:0});o.n++;o.r+=px[i];o.g+=px[i+1];o.b+=px[i+2];
    }
    const maior=(o,evita)=>Object.entries(o).filter(([h])=>evita==null||Math.min(Math.abs(h-evita),18-Math.abs(h-evita))>1).sort((a,b)=>b[1].n-a[1].n)[0];
    const e=maior(esc),v=maior(viv,e?+e[0]:null)||maior(viv);
    if(!e||!v)return avisa('Não achei cores marcantes no logo. Escolha uma das sugestões.');
    const cor=x=>rgbHex([x.r/x.n,x.g/x.n,x.b/x.n]);
    let c1=cor(e[1]);if(lum(c1)>0.08)c1=mix(c1,'#000000',0.35);
    await setTema(c1,cor(v[1]),'Cores do logo');
  }catch(e){avisa('Não consegui ler as cores do logo.')}
}

const minDe=h=>{if(!h)return null;const[a,b]=h.split(':').map(Number);return a*60+b};
function proximaPelada(){
  const a=aj();if(!a.dias||!a.dias.length)return null;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),ini=minDe(a.ini),fim=minDe(a.fim);
  for(let i=0;i<15;i++){const d=new Date(now);d.setDate(now.getDate()+i);
    if(!a.dias.includes(d.getDay()))continue;
    if(i===0&&fim!==null&&nm>fim)continue;
    return{d,hoje:i===0,agora:i===0&&ini!==null&&nm>=ini,iso:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};}
  return null;
}
