<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelada R10 R20</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3ecdc;--card:#fffaf0;--tx:#182c3c;--mut:#6e6a5c;--line:#e3d7bd;--pri:#b4561a;--pri2:#f6e0c8;--ok:#3f6b2a;--navy:#1f435b;--cream:#efe2c4;--warn:#9a5b0b;--warn2:#fbe9c4;--bad:#a61c1c;--bad2:#f9dcd6;--tag:#dfe8ee;--tagtx:#1f435b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a24;--card:#16263a;--tx:#efe6d2;--mut:#9ba7ae;--line:#26394d;--pri:#e07a35;--pri2:#3b2718;--ok:#86ba5f;--navy:#1f435b;--cream:#efe2c4;--warn:#f0a43a;--warn2:#3a2a0c;--bad:#f2867a;--bad2:#3d1a17;--tag:#1f3a52;--tagtx:#bcd3e3}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--navy);color:var(--cream);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--pri)}
header .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
header .brand img{height:42px;width:auto}
header h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:19px;margin:0;line-height:1;letter-spacing:.5px}
header h1 small{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8;margin-top:3px}
.slab{font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
.hero{background:var(--navy);color:var(--cream);border-radius:18px;padding:18px 16px 16px;text-align:center;margin-bottom:12px;border:3px solid var(--pri);position:relative;overflow:hidden}
.hero .hcfg{position:absolute;top:8px;left:8px;z-index:1;border:0;background:rgba(239,226,196,.14);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.hero .hauth{position:absolute;top:10px;right:10px;z-index:1}
.hero>img{width:150px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:26px;margin:8px 0 0;letter-spacing:1px}
.hero p{margin:2px 0 0;font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.8}
.hero .jtag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;background:rgba(239,226,196,.14);font-size:13px;font-weight:600}
.hero .prox{margin-top:14px;background:rgba(239,226,196,.12);border-radius:12px;padding:10px;font-size:14px}
.hero .prox b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;display:block;color:var(--hi,#f2a35e)}
.atal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.atal button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 4px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.atal button span{font-size:22px}
.card table td,.card table th{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.card table tr:last-child td{border-bottom:0}
.pg{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
.pg th,.pg td{padding:9px 0;text-align:center;border-bottom:1px solid var(--line)}
.pg thead th{font-size:11px;color:var(--mut);font-weight:700}
.pg .pg-n{width:27%;text-align:left;padding-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pg .pg-n small{display:block;font-size:9px;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.pg .pg-hj{color:var(--pri)}
.pg tr:last-child th,.pg tr:last-child td{border-bottom:0}
.dt{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.dt.ok{background:var(--ok)}.dt.is{background:transparent;border:2px solid var(--mut);width:10px;height:10px;box-sizing:border-box}.dt.dv{background:var(--bad)}.dt.av{background:var(--warn)}.dt.na{width:5px;height:5px;background:var(--line)}
.leg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
.finseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.finseg .chip{width:100%;padding:9px 4px;text-align:center;white-space:nowrap;font-size:14px}
.finseg .chip:nth-child(4){grid-column:1/-1}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.kp2 b{margin-top:0}.kp2 small{font-size:11px}
.kpsub{font-family:system-ui,sans-serif;font-size:13px;color:var(--mut);font-weight:400}
.fmt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fmt .chip{padding:8px 0;text-align:center}
.temas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tema{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:13px;text-align:left}
.tema.on{border-color:var(--pri)}
.tema i{display:flex;width:34px;height:22px;border-radius:6px;overflow:hidden;flex-shrink:0}
.tema i b{flex:1}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cores input[type=color]{height:44px;padding:4px;cursor:pointer}
.btn.big{width:100%;padding:16px;font-size:17px;margin-bottom:12px;border-radius:14px}
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pln{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);min-width:34px;font-size:16px}
.pli{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plc{display:block;font-size:11px;color:var(--mut);font-family:system-ui,sans-serif}
.plb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.plb:disabled{opacity:.3}
.plb.x{color:var(--bad)}
.filasep{background:var(--pri2);color:var(--pri);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:center;padding:4px}
.radio{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:15px;cursor:pointer}
.radio input{width:auto;margin:0 0 4px}
.radio small{color:var(--mut);font-size:12px}
.radios3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.radios3 .radio{padding:10px 8px;font-size:14px;line-height:1.2}
.radio:has(input:checked){border-color:var(--pri);background:var(--pri2)}
.time.jogo{outline:2px solid var(--pri)}
.time .inc{font-size:11px;color:var(--bad);font-family:system-ui,sans-serif}
.dtag{font-size:10px;background:var(--warn2);color:var(--warn);border-radius:6px;padding:0 4px;font-weight:700}
.placar{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;text-align:center;gap:6px}
.pl-nome{font-family:'Alfa Slab One',Georgia,serif;font-size:16px}
.pl-gols{font-family:'Alfa Slab One',Georgia,serif;font-size:58px;line-height:1.1;color:var(--pri)}
.pl-x{font-size:22px;color:var(--mut);padding-top:34px}
.pl-jog{font-size:11px;color:var(--mut);line-height:1.4}
.relogio{text-align:center}
.clk{font-family:'Alfa Slab One',Georgia,serif;font-size:54px;letter-spacing:2px;line-height:1.1}
.relogio.estourou{border-color:var(--bad);background:var(--bad2)}
.relogio.estourou .clk{color:var(--bad)}
.golbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.golbtns .btn{margin-bottom:10px;padding:16px 6px;line-height:1.3}
.golbtns small{font-size:12px;font-weight:400;opacity:.9}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cbtn{padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--tx);font-size:28px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cbtn small{font-size:12px}
.cbtn.on{border-color:var(--pri);background:var(--pri2)}
.fimjogo{text-align:center;border-color:var(--pri)}
.pen-tab{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px}
.pen-tab b{font-size:12px;color:var(--mut)}
.btn.big.bad{background:#b91c1c;color:#fff}
.valpen{margin-top:12px;padding:12px;border-radius:12px;background:var(--pri2);text-align:center;border:2px solid var(--pri)}
.lj{padding:8px 0;border-bottom:1px solid var(--line)}
.lj:last-child{border-bottom:0}
.lj1{font-size:15px}
.lj2{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 0 28px}
.sn{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--bg);border-radius:8px;padding:2px 7px}
.sn b{font-size:13px}
.sn.z{opacity:.4}
.sn.f{background:var(--pri2);color:var(--pri)}
.tj{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tj th{font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase;padding:4px 2px;border-bottom:2px solid var(--line)}
.tj td{padding:8px 2px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.tj tr:last-child td{border-bottom:0}
.tj th:first-child,.tj td:first-child{width:26px;text-align:left;font-size:11px}
.tj .tn{text-align:left;width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tj td.tn{font-size:14px}
.tj th{white-space:nowrap;overflow:hidden}
.tj td b{font-size:15px}
.tj .z{color:var(--mut);opacity:.6}
.tj tr.tsec td{text-align:left;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri2);padding:5px 8px;border-bottom:0}
.tj .tc{white-space:nowrap;padding-right:0}
.tj th:last-child,.tj td.tc{width:56px}
.kc{display:inline-flex;align-items:center;justify-content:center;width:15px;height:21px;border-radius:3px;font-size:11px;font-weight:800;margin:0 1px;box-shadow:0 1px 2px rgba(0,0,0,.4);font-family:system-ui,sans-serif;vertical-align:middle}
.kc.am{background:#facc15;color:#111}
.kc.az{background:#2563eb;color:#fff}
.kc.vm{background:#dc2626;color:#fff}
.pdt{display:block;font-size:10px;color:var(--mut)}
.dj .djw{grid-column:1/-1}
.djs{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:14px;color:var(--mut)}
.dj .djs b{display:inline;font-size:16px;color:var(--tx)}
.dj .djs span{display:inline}
.djs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dj .djs3{background:none;border-radius:0;padding:10px 0 0}
.dj .djs3 div{background:none;padding:0;border-radius:0}
.dj .djs3 b{font-size:20px}
.dj .djs3 small{font-size:11px}
.ved{display:block;font-size:10px;letter-spacing:.5px;margin-top:1px}
.ved i,.rtimes i,.vv,.ve,.vd{font-style:normal;font-weight:700}
.vv{color:var(--ok)}.ve{color:var(--mut)}.vd{color:var(--bad)}
.rtimes{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin:6px 0 8px}
.rtimes div{background:var(--bg);border-radius:10px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.testa{display:flex;align-items:center;gap:6px;margin:-4px 0 10px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.testa button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.testa button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.cxs{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut,#8aa);margin:10px 0 2px}
.cxt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:2px solid var(--line);padding-top:8px;text-align:center}.cxt small{display:block;font-size:11px;opacity:.75}.cxt b{font-size:15px}
.jcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jcol{background:var(--bg);border-radius:12px;padding:10px;border:2px solid transparent;min-width:0}
.jcol.venc{border-color:var(--ok)}
.jcol>b{display:block;margin-bottom:6px;font-size:14px}
.jl{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:13px;padding:3px 0}
.jl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl.sub{opacity:.55}.jl small{font-size:10px}
.jgk{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.tl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl:last-child{border-bottom:0}
.tl.b{flex-direction:row-reverse;text-align:right}
.tlm{color:var(--mut);font-size:12px;min-width:26px}
.tl>span:nth-child(2){flex:1}
.tlp{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);font-size:14px}
.pjseg{display:flex;gap:6px;margin-bottom:8px}.pjseg .chip{flex:1;padding:6px 10px;font-size:13px}.card .row .pjseg{margin:0;flex:0 0 auto}.card .row .pjseg .chip{flex:0 0 auto;padding:4px 10px;font-size:12px}
.tpj{width:100%;border-collapse:collapse;font-size:14px}.tpj th{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;padding:4px 6px;text-align:center}.tpj td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}.tpj .tn{text-align:left;width:100%}.tpj td.z{color:var(--mut);width:34px;text-align:left}.tpj td.on{font-weight:800;color:var(--pri);font-size:16px}.tpj th.on{color:var(--pri)}
.lids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lid{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.lid small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.lid b{display:block;font-size:17px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lid .lv{font-family:'Alfa Slab One',Georgia,serif;color:var(--pri);font-size:20px}
.dest{display:flex;align-items:center;gap:12px}
.dest .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--pri2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dest small{color:var(--mut);font-size:12px;display:block}
.dest b{font-size:16px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 12px;font-size:10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.card h3,.kpi b,.mes b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:19px;margin-top:4px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mes b{font-size:17px;text-transform:capitalize}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--pri);color:var(--onpri,#fff);cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.btn.bad{background:var(--bad2);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.list .it:last-child{border-bottom:0}
.it small{color:var(--mut);display:block;font-size:12px;margin-top:2px}
.click{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.chip i{font-style:normal;font-size:11px;opacity:.85;margin-right:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--tag);color:var(--tagtx);font-weight:600;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--pri2);color:var(--pri)}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.b{background:var(--bad2);color:var(--bad)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.step b{min-width:18px;text-align:center}
.pst{padding:10px 0;border-bottom:1px solid var(--line)}
.pst:last-child{border-bottom:0}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.stc .step{gap:2px}
.stc .step button{width:24px;height:30px;font-size:15px;padding:0}
.stc .step b{min-width:14px;font-size:14px}
.dj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dj div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.dj b{display:block;font-size:22px}
.dj small{color:var(--mut);font-size:12px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.time{border-radius:12px;padding:10px;background:var(--pri2)}
.time:nth-child(2){background:var(--tag)}
.time b{display:block;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hidden{display:none}
.dlg{z-index:30;align-items:center;padding:16px}
.dsheet{border-radius:16px;max-width:400px}
.dsheet p{margin:0 0 16px;font-size:16px;line-height:1.4}
.dsheet .row{justify-content:flex-end}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.rk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.seg{display:flex;gap:6px;margin-bottom:10px}
body.ro .adm{display:none!important}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 body{padding:0;background:#fff}
 #print{display:block;color:#000;font-family:Arial,sans-serif}
 #print table{width:100%;border-collapse:collapse}
 #print td,#print th{border:1px solid #000;padding:6px;font-size:13px}
 #print td{height:30px}
}
</style>

function diffM(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+(mb-ma)}

async function buscaPapel(session){
  if(!session)return setPapel(null);
  const{data}=await sb.from('admins').select('papel').eq('user_id',session.user.id).maybeSingle();
  setPapel(data?data.papel:null);

async function load(){
  if(sb){
    const{data:{session}}=await sb.auth.getSession();
    await buscaPapel(session);
    const{data,error}=await sb.from('docs').select('colecao,dados');
    if(error){avisa('Erro ao carregar: '+error.message);return}
    Object.keys(DB).forEach(k=>DB[k]=[]);
    data.forEach(r=>DB[r.colecao]&&DB[r.colecao].push(r.dados));
    // times e jogos ficam num registro separado (o juiz só grava esse)
    DB.partidas.forEach(pt=>{const p=DB.peladas.find(x=>x.id===pt.pid);if(p){p.times=pt.times||[];p.jogos=pt.jogos||[];if(Array.isArray(pt.presentes))p.presentes=pt.presentes}});
  }else{
    try{const s=localStorage.getItem(LS);if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
  }
}

async function put(col,obj){
  const arr=DB[col];const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  if(sb){
    let erro=null;
    if(col==='peladas'){
      const{times,jogos,...base}=obj;
      if(isAdmin){const r=await sb.from('docs').upsert({id:obj.id,colecao:'peladas',dados:base});erro=r.error}
      if(!erro&&(isAdmin||isJuiz)){const r=await sb.from('docs').upsert({id:'pt_'+obj.id,colecao:'partidas',dados:{id:'pt_'+obj.id,pid:obj.id,presentes:obj.presentes||[],times:times||[],jogos:jogos||[]}});erro=r.error}
    }else if(isJuiz&&col==='jogadores'){const r=await sb.from('docs').insert({id:obj.id,colecao:col,dados:obj});erro=r.error}
    else{const r=await sb.from('docs').upsert({id:obj.id,colecao:col,dados:obj});erro=r.error}
    if(erro)avisa('Erro ao salvar: '+erro.message);
  }
  else persistLocal();
}
async function del(col,id){
  DB[col]=DB[col].filter(x=>x.id!==id);
  if(sb){const{error}=await sb.from('docs').delete().in('id',col==='peladas'?[id,'pt_'+id]:[id]);if(error)avisa('Erro ao excluir: '+error.message)}
  else persistLocal();
}

// ===== regras =====
const lastBy=(list,m)=>[...(list||[])].filter(v=>v.desde<=m).sort((a,b)=>a.desde.localeCompare(b.desde)).pop();
const cfgMes=m=>lastBy(DB.config,m)||{mensalidade:0,diaria:0,vencimento:10};
const tipoMes=(j,m)=>(lastBy(j.tipos,m)||{}).tipo||'diarista';
// mensalidade só é devida a partir da entrada; quem entra depois do vencimento começa no mês seguinte
function deveMes(j,m){
  if(!j.entrada)return true;
  const em=ym(j.entrada);
  if(m<em)return false;
  if(m===em&&+j.entrada.slice(8,10)>cfgMes(m).vencimento)return false;
  return true;
}
const jog=id=>DB.jogadores.find(j=>j.id===id);
const nomeJ=id=>{const j=jog(id);return j?(j.apelido||j.nome):'(removido)'};
const curP=()=>DB.peladas.find(p=>p.id===S.peladaId);

const diasNoMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const diaNoMes=(m,ref)=>`${m}-${p2(Math.min(+(ref||'').slice(8,10)||1,diasNoMes(m)))}`;
function despesasMes(m){
  const out=[];
  DB.despesas.forEach(d=>{
    if(d.tipo==='avista'){
      if(ym(d.data)===m)out.push({d,valor:+d.valor,dt:d.data,lab:'à vista · '+dataBR(d.data)+(d.peladaId?' · pelada':'')});
    }else if(d.tipo==='parcelada'){
      const i=diffM(ym(d.data),m);
      if(i>=0&&i<d.parcelas)out.push({d,valor:d.valor/d.parcelas,dt:diaNoMes(m,d.data),lab:`parcela ${i+1}/${d.parcelas}`});
    }else if(d.tipo==='recorrente'){
      if(m>=d.inicio&&(!d.fim||m<=d.fim)){const v=lastBy(d.vigencias,m);if(v)out.push({d,valor:+v.valor,dt:diaNoMes(m,d.cadastro),lab:'recorrente'})}
    }
  });
  return out;
}
const receitasMes=m=>DB.receitas.filter(r=>ym(r.data)===m);
function primeiroMes(){
  const ms=[...DB.receitas.map(r=>ym(r.data)),...DB.despesas.map(d=>d.tipo==='recorrente'?d.inicio:ym(d.data))];
  return ms.length?ms.sort()[0]:S.mes;
}
function saldoAte(m){
  let s=0,c=primeiroMes(),guard=0;
  while(c<=m&&guard++<600){s+=soma(receitasMes(c),r=>r.valor)-soma(despesasMes(c),x=>x.valor);c=addM(c,1)}
  return s;
}
function pendencias(m){
  const c=cfgMes(m),out=[];
  DB.jogadores.filter(j=>j.ativo!==false&&tipoMes(j,m)==='mensalista'&&deveMes(j,m)).forEach(j=>{
    const pago=DB.receitas.some(r=>r.tipo==='mensalidade'&&r.jogadorId===j.id&&r.competencia===m);
    if(!pago&&c.mensalidade>0){const venc=`${m}-${p2(c.vencimento)}`;out.push({tipo:'mensalidade',j,venc,atrasado:hoje()>venc,valor:c.mensalidade})}
  });
  DB.peladas.filter(p=>ym(p.data)===m&&p.status!=='cancelada').forEach(p=>(p.presentes||[]).forEach(id=>{
    const j=jog(id);
    if(j&&c.diaria>0&&tipoMes(j,m)==='diarista'&&!DB.receitas.some(r=>r.tipo==='diaria'&&r.peladaId===p.id&&r.jogadorId===id))
      out.push({tipo:'diaria',j,p,atrasado:true,valor:c.diaria});
  }));
  return out;
}
const perRk=()=>S.rk==='mes'?S.mes:S.rk==='ano'?S.mes.slice(0,4):null;
const perNome=()=>S.rk==='mes'?nomeMes(S.mes):S.rk==='ano'?'ano de '+S.mes.slice(0,4):'geral';
const novoSt=()=>({g:0,ca:0,cz:0,cv:0,pr:0,gs:0,pd:0,jg:0,v:0,e:0,d:0});
// quem jogou por um lado no jogo (escalação final, quem saiu substituído e os goleiros que passaram pelo gol)
function ladoJogou(j,l){
  const ev=j.ev||[],o=l==='a'?'b':'a';
  return[...new Set([...j[l].jog,j[l].gk,...ev.filter(e=>e.t==='sub'&&e.lado===l).map(e=>e.sai),...ev.filter(e=>e.t==='gol'&&e.lado===o&&e.gkSof).map(e=>e.gkSof)].filter(Boolean))];
}
// lances dos jogos -> [jogadorId, campo, quantidade]
function statsJogos(p){
  const out=[];
  (p.jogos||[]).forEach(j=>{
    const gk={a:j.a.gk,b:j.b.gk};
    new Set([...j.a.jog,...j.b.jog,...(j.ev||[]).filter(e=>e.t==='sub').map(e=>e.sai),...(j.ev||[]).filter(e=>e.t==='gol'&&e.gkSof).map(e=>e.gkSof),gk.a,gk.b].filter(Boolean)).forEach(id=>out.push([id,'jg',1]));
    (j.ev||[]).forEach(e=>{
      if(e.t==='gol'){if(e.jid&&!e.contra)out.push([e.jid,'g',1]);const sof='gkSof' in e?e.gkSof:(e.lado==='a'?gk.b:gk.a);if(sof)out.push([sof,'gs',1])}
      else if(e.t==='cartao'&&e.jid)out.push([e.jid,e.cor,1]);
    });
    ((j.pen&&j.pen.k)||[]).forEach(k=>{if(k.r==='def'){const g='gk' in k?k.gk:(k.lado==='a'?gk.b:gk.a);if(g)out.push([g,'pd',1])}});
    // vitória / empate (saíram os dois) / derrota — pênaltis decidem
    const v=vencedor(j);
    if(v){ladoJogou(j,v).forEach(id=>out.push([id,'v',1]));ladoJogou(j,v==='a'?'b':'a').forEach(id=>out.push([id,'d',1]))}
    else if(j.fim&&j.desfecho==='saem')[...ladoJogou(j,'a'),...ladoJogou(j,'b')].forEach(id=>out.push([id,'e',1]));
  });
  return out;
}
function ranking(m){
  const t={};
  DB.peladas.filter(p=>p.status!=='cancelada'&&(!m||p.data.startsWith(m))).forEach(p=>{
    (p.presentes||[]).forEach(id=>{(t[id]=t[id]||novoSt()).pr++});
    Object.entries(p.stats||{}).forEach(([id,s])=>{const x=(t[id]=t[id]||novoSt());x.g+=s.g||0;x.ca+=s.ca||0;x.cz+=s.cz||0;x.cv+=s.cv||0});
    statsJogos(p).forEach(([id,k,v])=>{const x=(t[id]=t[id]||novoSt());x[k]+=v});
  });
  return Object.entries(t).map(([id,x])=>({id,...x}));
}

const TEMAS=[['Das Antigas','#1f435b','#b4561a','#e07a35'],['Verde Gramado','#14532d','#eab308'],['Rubro-negro','#1c1917','#dc2626'],['Azul e Vermelho','#0b2a5b','#e11d48'],
 ['Preto e Branco','#171717','#d4d4d4'],['Céu','#0c4a6e','#38bdf8'],['Roxo e Laranja','#3b0764','#f97316'],['Grená e Ouro','#5b1020','#d4a017']];
const hexRgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgbHex=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const mix=(a,b,t)=>{const A=hexRgb(a),B=hexRgb(b);return rgbHex(A.map((v,i)=>v+(B[i]-v)*t))};
const tema=()=>{const t=aj().tema;return t&&t.c1?t:{nome:'Das Antigas',c1:'#1f435b',c2:'#b4561a',c2d:'#e07a35'}};
const escuro=()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
function coresTema(){
  const{c1,c2,c2d}=tema(),dk=escuro();
  const pri=dk?(c2d||(lum(c2)<0.2?mix(c2,'#ffffff',0.2):c2)):c2;
  const tx=lum(c1)>0.4?'#182c3c':'#efe2c4';
  return{c1,c2,pri,tx,onpri:lum(pri)>0.45?'#182c3c':'#ffffff',hi:lum(c1)>0.4?c2:mix(c2,'#ffffff',0.35),pri2:dk?mix(pri,'#0e1a24',0.78):mix(pri,'#ffffff',0.82)};
}
function aplicaTema(){

  r.setProperty('--navy',k.c1);r.setProperty('--cream',k.tx);r.setProperty('--pri',k.pri);r.setProperty('--onpri',k.onpri);r.setProperty('--pri2',k.pri2);r.setProperty('--hi',k.hi);

const carregaImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function trocaLogo(){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files&&i.files[0];if(!f)return;
    try{
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      const img=await carregaImg(url),M=360,k=Math.min(1,M/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let d=cv.toDataURL('image/webp',0.9);if(!d.startsWith('data:image/webp'))d=cv.toDataURL('image/png');
      await put('ajustes',{...aj(),logo:d});render();
      if(await confirma('Logo atualizado! Quer que o app pegue as cores do logo?','Pegar cores'))coresDoLogo();
    }catch(e){avisa('Não consegui abrir essa imagem. Tente um PNG ou JPG.')}
  };
  i.click();
}
async function logoOriginal(){if(!await confirma('Voltar para o logo original da pelada?'))return;const a={...aj()};delete a.logo;await put('ajustes',a);render()}
async function coresDoLogo(){
  try{
    const img=await carregaImg(logoAtual()),N=80,cv=document.createElement('canvas');cv.width=N;cv.height=N;
    const c=cv.getContext('2d');c.drawImage(img,0,0,N,N);const px=c.getImageData(0,0,N,N).data;
    const esc={},viv={};
    for(let i=0;i<px.length;i+=4){
      if(px[i+3]<200)continue;
      const r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
      if(d<0.08)continue;
      const sat=d/(1-Math.abs(2*l-1));let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(((h*60)+360)%360/20);
      const alvo=l<0.32?esc:(sat>0.35&&l<0.75?viv:null);if(!alvo)continue;
      const o=(alvo[h]=alvo[h]||{n:0,r:0,g:0,b:0});o.n++;o.r+=px[i];o.g+=px[i+1];o.b+=px[i+2];
    }
    const maior=(o,evita)=>Object.entries(o).filter(([h])=>evita==null||Math.min(Math.abs(h-evita),18-Math.abs(h-evita))>1).sort((a,b)=>b[1].n-a[1].n)[0];
    const e=maior(esc),v=maior(viv,e?+e[0]:null)||maior(viv);
    if(!e||!v)return avisa('Não achei cores marcantes no logo. Escolha uma das sugestões.');
    const cor=x=>rgbHex([x.r/x.n,x.g/x.n,x.b/x.n]);
    let c1=cor(e[1]);if(lum(c1)>0.08)c1=mix(c1,'#000000',0.35);
    await setTema(c1,cor(v[1]),'Cores do logo');
  }catch(e){avisa('Não consegui ler as cores do logo.')}
}

const minDe=h=>{if(!h)return null;const[a,b]=h.split(':').map(Number);return a*60+b};
function proximaPelada(){
  const a=aj();if(!a.dias||!a.dias.length)return null;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),ini=minDe(a.ini),fim=minDe(a.fim);
  for(let i=0;i<15;i++){const d=new Date(now);d.setDate(now.getDate()+i);
    if(!a.dias.includes(d.getDay()))continue;
    if(i===0&&fim!==null&&nm>fim)continue;
    return{d,hoje:i===0,agora:i===0&&ini!==null&&nm>=ini,iso:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};}
  return null;
}

function inadimplentesAno(y){
  const g={},hm=ym(hoje());
  mesesAno(y).filter(m=>m<=hm).forEach(m=>pendencias(m).filter(x=>x.atrasado).forEach(x=>{
    const k=x.j.id,o=(g[k]=g[k]||{j:x.j,meses:[],diarias:[],total:0});o.total+=+x.valor||0;
    if(x.tipo==='mensalidade')o.meses.push(m);else o.diarias.push(x.p.data);
  }));
  return Object.values(g).sort((a,b)=>b.total-a.total||byNome(a.j,b.j));
}

function montaTimes(p){
  const m=ym(p.data),n=porTime(),N=2*n;
  const linha=(p.presentes||[]).filter(k=>!ehGoleiro(k));
  const diar=k=>{const j=jog(k);return j&&tipoMes(j,m)==='diarista'};
  const ordem=[...linha.filter(k=>!diar(k)),...linha.filter(diar)];
  const prim=shuffle(ordem.slice(0,N)),resto=shuffle(ordem.slice(N));
  const h=Math.ceil(prim.length/2),times=[prim.slice(0,h),prim.slice(h)].filter(t=>t.length);
  for(let i=0;i<resto.length;i+=n)times.push(resto.slice(i,i+n));
  return times;
}

  ${r&&listaEspera(p).length?`<p class="empty" style="margin-bottom:0"><b>⏳ Lista de espera:</b> ${listaEspera(p).map((k,i)=>`${i+1}. ${esc(nomeJ(k))}`).join(' · ')}</p>`:''}
  ${r&&podeLista(p)&&listaEspera(p).length>=n?`<button class="btn sec sm" style="width:100%;margin-top:8px" onclick="formaTime()">➕ Formar Time ${r.length+1} com a lista de espera</button>`:''}

function vencedor(j){if(!j.fim)return null;if(j.res==='a'||j.res==='b')return j.res;if(j.pen&&j.pen.venc&&j.pen.ok)return j.pen.venc;return null}
const tempoJ=j=>(j.acc||0)+(j.t0?(Date.now()-j.t0)/1000:0);
const mmss=t=>{t=Math.max(0,Math.floor(t));return `${p2(Math.floor(t/60))}:${p2(t%60)}`};
const curJ=()=>{const p=curP();return p&&(p.jogos||[]).find(j=>j.id===S.jogoId)};
// rodízio: quem ganha fica, quem perde vai pro fim da fila; empate sem pênaltis saem os dois
function estadoFila(p){
  const k=(p.times||[]).length;let em=[0,1],q=[...Array(k).keys()].slice(2);
  for(const j of (p.jogos||[])){
    const A=j.a.t,B=j.b.t;q=q.filter(x=>x!==A&&x!==B);
    const v=vencedor(j);
    if(!j.fim||(!v&&j.desfecho!=='saem'))return{em:[A,B],q,rolando:true};
    if(v){const w=v==='a'?A:B,l=v==='a'?B:A;q.push(l);em=[w,q.shift()]}
    else{q.push(A,B);em=[q.shift(),q.shift()]}
  }
  return{em,q:q.filter(x=>!em.includes(x)),rolando:false};
}
function proximoJogo(p){if((p.times||[]).length<2)return null;const e=estadoFila(p);return e.rolando?null:e.em}
// quem entra (substituição ou completar time): times que estão esperando, do que espera há mais tempo;
// dentro do time, quem chegou primeiro. Depois, quem está sem time.
function candidatos(p,jogando,T){
  T=T||p.times||[];
  const mach=machucados(p),ar=k=>(p.presentes||[]).indexOf(k),ok=k=>!mach.has(k)&&!ehGoleiro(k);
  const fila=estadoFila(p).q.filter(t=>!jogando.includes(t)&&T[t]);
  const dosTimes=fila.flatMap(t=>[...T[t]].sort((a,b)=>ar(a)-ar(b)).filter(ok).map(k=>({k,t})));
  return[...dosTimes,...listaEspera(p).filter(ok).map(k=>({k,t:null}))];

function listaEspera(p){
  const mach=machucados(p),noTime=new Set((p.times||[]).flat()),saiu=[];
  (p.jogos||[]).forEach(j=>(j.ev||[]).forEach(e=>{if(e.t==='sub'){const i=saiu.indexOf(e.sai);if(i>=0)saiu.splice(i,1);saiu.push(e.sai)}}));
  const livres=(p.presentes||[]).filter(k=>!ehGoleiro(k)&&!noTime.has(k)&&!mach.has(k));
  return[...livres.filter(k=>!saiu.includes(k)),...saiu.filter(k=>livres.includes(k))];

// monta o jogo com os times fixos; se faltar gente, completa com a lista de espera e o jogador passa a ser do time
function montaJogo(p,ta,tb,grava){
  const n=porTime(),T=(p.times||[]).map(t=>[...t]),emp={a:[],b:[]};
  const fila=candidatos(p,[ta,tb],T);
  for(const[l,t] of [['a',ta],['b',tb]])while(T[t].length<n&&fila.length){const c=fila.shift();if(c.t!==null){const ix=T[c.t].indexOf(c.k);if(ix>=0)T[c.t].splice(ix,1)}T[t].push(c.k);emp[l].push(c.k)}

function aptosPen(j,lado){
  const todos=[...j[lado].jog,...(j[lado].gk?[j[lado].gk]:[])];
  const n=x=>((j.pen&&j.pen.k)||[]).filter(c=>c.lado===lado&&c.jid===x).length;
  const min=Math.min(...todos.map(n));
  return todos.filter(x=>n(x)===min);
}

async function salvaJog(id,addPelada){
  const ape=val('fjApe');if(!ape)return avisa('Informe o apelido.');
  const nome=val('fjNome')||ape;
  if(DB.jogadores.some(x=>x.id!==id&&(x.apelido||x.nome).toLowerCase()===ape.toLowerCase())&&!await confirma(`Já existe um "${ape}". Cadastrar outro com o mesmo apelido?`))return;
  let j=id?jog(id):null;
  if(j){
    j.nome=nome;j.apelido=val('fjApe');j.ativo=val('fjAtivo')!=='0';j.pos=val('fjPos')||'jogador';j.entrada=val('fjEntrada')||j.entrada||'';
    const t=val('fjTipo'),d=val('fjDesde');
    if(t&&d){
      if(d<ym(hoje())&&!await confirma('Essa mudança é retroativa e altera meses passados. Confirmar?'))return;
      j.tipos=(j.tipos||[]).filter(x=>x.desde!==d);j.tipos.push({desde:d,tipo:t});

// PDF de uma página com a imagem (sem biblioteca externa)
function canvasPDF(cv){
  const jpg=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]);
  const W=595,H=Math.round(595*cv.height/cv.width);
  const enc=t=>{const a=new Uint8Array(t.length);for(let i=0;i<t.length;i++)a[i]=t.charCodeAt(i)&255;return a};
  const parts=[],offs=[];let pos=0;
  const add=t=>{const b=enc(t);parts.push(b);pos+=b.length};
  const obj=(n,fn)=>{offs[n]=pos;add(n+' 0 obj\n');fn();add('\nendobj\n')};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream')});
  const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const x=pos;
  add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join(''));
  add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function baixaBlob(b,nome){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
async function exportaCanvas(cv,base,titulo,textoZap){
  const png=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!png)return avisa('Não consegui gerar a imagem.');
  const fPng=new File([png],base+'.png',{type:'image/png'});
  const podeArquivo=!!(navigator.canShare&&navigator.canShare({files:[fPng]}));
  const op=await dialogo(titulo,[['🟢 Mandar a foto no WhatsApp','','zap'],['📷 Salvar foto','sec','png'],['📄 Salvar PDF','sec','pdf'],['Cancelar','ghost',null]],true);
  const semShare=()=>{baixaBlob(png,base+'.png');avisa('A foto foi salva no aparelho. Abra o WhatsApp, entre no grupo e anexe a foto pela galeria.\n\nDica: abrindo o app pelo navegador do celular (Chrome ou Safari), esse botão já abre o WhatsApp direto com a foto.')};
  if(op==='png')baixaBlob(png,base+'.png');
  else if(op==='pdf')baixaBlob(canvasPDF(cv),base+'.pdf');
  else if(op==='zap'){
    if(podeArquivo){try{await navigator.share({files:[fPng]})}catch(e){if(e.name!=='AbortError')semShare()}}
    else semShare();
  }
}

function detDesp(id){

async function salvaDesp(){

function formReajuste(id){const d=DB.despesas.find(x=>x.id===id);modal(`<h3>Reajustar: ${esc(d.descricao)}</h3><p class="empty">O valor antigo continua valendo nos meses anteriores.</p><label>Novo valor mensal</label><input id="frV" type="number" step="0.01" inputmode="decimal"><label>A partir de</label><input id="frD" type="month" value="${ym(hoje())}">${botoesModal(`salvaReajuste('${id}')`)}`)}
async function salvaReajuste(id){
  const d=DB.despesas.find(x=>x.id===id),v=num('frV'),de=val('frD');if(!temValor('frV')||!de)return avisa('Informe valor e mês. O valor pode ser 0.');

// caixa da pelada: diárias (pagas e pendentes) + despesas do dia
function caixaPelada(p){
  const m=ym(p.data),vd=cfgMes(m).diaria;
  const diar=(p.presentes||[]).filter(k=>jog(k)&&tipoMes(jog(k),m)==='diarista');
  const pagas=DB.receitas.filter(x=>x.tipo==='diaria'&&x.peladaId===p.id);
  const pend=vd>0?diar.filter(k=>!pagas.some(x=>x.jogadorId===k)):[];
  const desp=DB.despesas.filter(d=>d.peladaId===p.id);
  const ent=soma(pagas,x=>x.valor),sai=soma(desp,d=>d.valor);
  return{vd,pagas,pend,desp,ent,sai,saldo:ent-sai,aReceber:pend.length*vd};
}
function caixaPeladaHTML(p){
  const c=caixaPelada(p),sub=t=>`<div class="cxs">${t}</div>`;
  const pg=c.pagas.map(r=>`<div class="rk"><span>✅ ${esc(nomeJ(r.jogadorId))}</span><b class="pos">${brl(r.valor)}</b></div>`).join('');
  const pd=c.pend.map(k=>`<div class="rk"><span>⏳ ${esc(nomeJ(k))} <small class="empty" style="padding:0">não pagou</small></span><b class="neg">${brl(c.vd)}</b></div>`).join('');
  const ds=c.desp.map(d=>`<div class="rk"><span>💸 ${esc(d.descricao||d.categoria)}${d.descricao?` <small class="empty" style="padding:0">${esc(d.categoria)}</small>`:''}</span><b class="neg">${brl(d.valor)}</b></div>`).join('');
  return `<h3 style="margin:16px 0 4px;font-size:14px">💰 Caixa da pelada</h3>
  ${sub(`Diárias recebidas · ${c.pagas.length}`)}${pg||'<div class="empty" style="padding:4px 0">Nenhuma diária recebida.</div>'}
  ${c.pend.length?sub(`Diárias pendentes · ${c.pend.length}`)+pd:''}
  ${sub(`Despesas do dia · ${c.desp.length}`)}${ds||'<div class="empty" style="padding:4px 0">Nenhuma despesa lançada.</div>'}
  <div class="cxt"><div><small>Entrou</small><b class="pos">${brl(c.ent)}</b></div><div><small>Saiu</small><b class="neg">${brl(c.sai)}</b></div><div><small>Saldo do dia</small><b class="${c.saldo<0?'neg':'pos'}">${brl(c.saldo)}</b></div></div>
  ${c.aReceber?`<div class="empty" style="font-size:12px;padding:4px 0 0">Ainda falta receber ${brl(c.aReceber)} de diárias.</div>`:''}
  <div class="empty" style="font-size:11px;padding:2px 0 0">Mensalistas pagam pela mensalidade do mês, por isso não entram aqui.</div>`;

  const rk=ranking(y),ps=DB.peladas.filter(p=>p.data.startsWith(y)),real=ps.filter(p=>p.status!=='cancelada');
  const ms=mesesAno(y),rs=DB.receitas.filter(r=>r.data.startsWith(y)),ent=soma(rs,r=>r.valor);
  const dsAll=ms.flatMap(m=>despesasMes(m)),sai=soma(dsAll,x=>x.valor),saldo=saldoAte(y+'-12');
  const inad=inadimplentesAno(y),naoRec=soma(inad,g=>g.total);

function novoRel(){
  const W=1080,P=56,F='system-ui,-apple-system,Segoe UI,Roboto,sans-serif',SL="'Alfa Slab One',Georgia,serif";
  const TX='#182c3c',MU='#6e6a5c',LN='#e3d7bd',OK='#3f6b2a',BAD='#a61c1c',WARN='#b45309',CARD='#fffaf0';
  const mc=document.createElement('canvas').getContext('2d');
  const quebra=(t,font,max)=>{mc.font=font;const ws=String(t).split(' '),ls=[];let l='';ws.forEach(w=>{const tt=l?l+' '+w:w;if(mc.measureText(tt).width>max&&l){ls.push(l);l=w}else l=tt});if(l)ls.push(l);return ls};
  const ops=[];
  const R={W,P,F,SL,TX,MU,LN,OK,BAD,WARN,CARD,ops,
    kpis(arr){for(let i=0;i<arr.length;i+=2){const par=arr.slice(i,i+2);ops.push({h:142,f:(c,y,u)=>{const w=(W-2*P-16)/2;par.forEach(([l,v,cor],k)=>{const x=P+k*(w+16);u.rr(x,y,w,124,16,CARD);u.txt(l,x+24,y+44,`24px ${F}`,MU);u.txt(v,x+24,y+98,`44px ${SL}`,cor||TX)})}})}},
    sec(t){ops.push({h:96,f:(c,y,u)=>{u.txt(t,P,y+56,`38px ${SL}`,TX);u.hr(y+76)}})},
    linha(a,b,v,cor){ops.push({h:b?84:62,f:(c,y,u)=>{u.txt(u.corte(a,W-2*P-300,`bold 28px ${F}`),P+8,y+34,`bold 28px ${F}`,TX);if(b)u.txt(u.corte(b,W-2*P-300,`22px ${F}`),P+8,y+66,`22px ${F}`,MU);if(v!=null)u.txt(v,W-P-8,y+34,`bold 28px ${F}`,cor||TX,'right');u.hr(y+(b?80:58),1)}})},
    sub(a,v,cor){ops.push({h:58,f:(c,y,u)=>{u.rr(P,y+4,W-2*P,46,10,'#ece3cf');u.txt(a,P+16,y+36,`bold 24px ${F}`,TX);if(v!=null)u.txt(v,W-P-16,y+36,`bold 24px ${F}`,cor||TX,'right')}})},
    tabela(cols,rows){ // cols:[{t,x,al}] x = posição da coluna
      ops.push({h:48,f:(c,y,u)=>cols.forEach(k=>u.txt(k.t,k.x,y+32,`bold 21px ${F}`,MU,k.al||'left'))});
      rows.forEach((r,i)=>ops.push({h:54,f:(c,y,u)=>{if(r.fundo)u.rr(P,y,W-2*P,54,8,r.fundo);else if(i%2)c.fillStyle='#ece3cf',c.fillRect(P,y,W-2*P,54);r.c.forEach((v,k)=>{const o=typeof v==='object'&&v?v:{v};u.txt(String(o.v),cols[k].x,y+36,`${o.b?'bold ':''}${o.s||26}px ${F}`,o.cor||TX,cols[k].al||'left')})}}));
    },
    grade(ms,linhas){
      const nx=P,cw=(W-2*P-250)/ms.length,x0=P+250;
      ops.push({h:46,f:(c,y,u)=>ms.forEach((m,i)=>u.txt(MESES[+m.slice(5)-1].slice(0,3),x0+i*cw+cw/2,y+30,`bold 20px ${F}`,MU,'center'))});
      const cor={ok:OK,dv:BAD,av:'#d08a1c',is:null,na:'#d6ccb4',fut:null};
      linhas.forEach((l,i)=>ops.push({h:58,f:(c,y,u)=>{if(i%2)c.fillStyle='#ece3cf',c.fillRect(P,y,W-2*P,58);
        u.txt(u.corte(l.nome,240,`bold 24px ${F}`),nx+8,y+28,`bold 24px ${F}`,TX);if(l.sub)u.txt(u.corte(l.sub,240,`18px ${F}`),nx+8,y+50,`18px ${F}`,MU);
        l.cels.forEach((st,k)=>{const cx=x0+k*cw+cw/2,cy=y+29;c.beginPath();
          if(st==='is'){c.arc(cx,cy,10,0,7);c.strokeStyle=MU;c.lineWidth=3;c.stroke()}
          else if(st==='na'){c.arc(cx,cy,5,0,7);c.fillStyle=cor.na;c.fill()}
          else if(cor[st]){c.arc(cx,cy,13,0,7);c.fillStyle=cor[st];c.fill()}})}}));
      ops.push({h:60,f:(c,y,u)=>{let x=P+4;[['pago',OK,'f'],['devendo',BAD,'f'],['a vencer','#d08a1c','f'],['isento',MU,'s'],['não devia','#d6ccb4','p']].forEach(([t,k,tp])=>{c.beginPath();c.arc(x+12,y+34,tp==='p'?5:11,0,7);if(tp==='s'){c.strokeStyle=k;c.lineWidth=3;c.stroke()}else{c.fillStyle=k;c.fill()}u.txt(t,x+30,y+42,`22px ${F}`,MU);mc.font=`22px ${F}`;x+=50+mc.measureText(t).width})}});
    },
    nota(t,cor){const ls=quebra(t,`22px ${F}`,W-2*P);ops.push({h:12+ls.length*32,f:(c,y,u)=>ls.forEach((l,i)=>u.txt(l,P,y+30+i*32,`22px ${F}`,cor||MU))})},
    vazio(t){ops.push({h:56,f:(c,y,u)=>u.txt(t,P+8,y+36,`24px ${F}`,MU)})},
    esp(h){ops.push({h,f:()=>{}})}
  };
  return R;
}
function exportaRel(R,titulo,arq,zap){
  const{W,P,F,SL,LN}=R,T=coresTema(),cab=290,rod=110;
  const H=cab+soma(R.ops,o=>o.h)+rod;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const u={
    txt:(t,x,y,font,cor,al)=>{c.font=font;c.fillStyle=cor;c.textAlign=al||'left';c.fillText(t,x,y)},
    corte:(t,max,font)=>{t=String(t);c.font=font;if(c.measureText(t).width<=max)return t;while(t.length&&c.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'},
    rr:(x,y,w,h,r,cor)=>{c.fillStyle=cor;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill()},
    hr:(y,l)=>{c.strokeStyle=LN;c.lineWidth=l||2;c.beginPath();c.moveTo(P,y);c.lineTo(W-P,y);c.stroke()}
  };
  c.fillStyle='#f3ecdc';c.fillRect(0,0,W,H);
  c.fillStyle=T.c1;c.fillRect(0,0,W,250);c.fillStyle=T.c2;c.fillRect(0,250,W,10);
  if(logoImg.complete&&logoImg.naturalWidth){const lh=200,lw=lh*logoImg.naturalWidth/logoImg.naturalHeight;c.drawImage(logoImg,P-10,25,lw,lh)}
  const tx=P+200;u.txt(NOME,tx,105,`64px ${SL}`,T.tx);u.txt(SUB.toUpperCase(),tx,150,`bold 30px ${F}`,T.tx);
  u.txt(u.corte(titulo,W-tx-P,`38px ${SL}`),tx,212,`38px ${SL}`,T.hi);
  let y=cab;R.ops.forEach(o=>{o.f(c,y,u);y+=o.h});
  u.txt('Gerado em '+dataBR(hoje()),W/2,H-44,`24px ${F}`,R.MU,'center');
  exportaCanvas(cv,arq,titulo,zap);
}
const MesCap=m=>{const t=nomeMes(m);return t.charAt(0).toUpperCase()+t.slice(1)};
function statusPag(j,m){

function fotoFin(){
  const m=S.mes,k=S.fin||'geral',R=novoRel();
  if(k==='geral'){
    const rs=receitasMes(m),ds=despesasMes(m),ent=soma(rs,r=>r.valor),sai=soma(ds,x=>x.valor),saldo=saldoAte(m),dev=agrupaDev(m);

    R.sec('Saídas por categoria');
    const cats={};ds.forEach(x=>(cats[x.d.categoria]=cats[x.d.categoria]||[]).push(x));
    const ca=Object.entries(cats).sort((a,b)=>soma(b[1],x=>x.valor)-soma(a[1],x=>x.valor));
    ca.length?ca.forEach(([l,a])=>R.linha(l,a.map(x=>x.d.descricao||x.d.categoria).join(' · '),brl(soma(a,x=>x.valor)),R.BAD)):R.vazio('Nada saiu no mês.');
    relDevedores(R,m);
    const y=m.slice(0,4),hm=ym(hoje());let tE=0,tD=0;
    R.sec(`Ano de ${y}`);
    const X={m:R.P+12,e:560,d:760,r:R.W-R.P-12};
    R.tabela([{t:'MÊS',x:X.m},{t:'ENTROU',x:X.e,al:'right'},{t:'SAIU',x:X.d,al:'right'},{t:'RESULTADO',x:X.r,al:'right'}],
      mesesAno(y).filter(x=>x<=hm&&x>=primeiroMes()).map(x=>{const e=soma(receitasMes(x),r=>r.valor),d=soma(despesasMes(x),z=>z.valor);tE+=e;tD+=d;
        return{fundo:x===m?'#f6e0c8':null,c:[{v:MesCap(x),b:x===m},{v:brl(e),cor:R.OK},{v:brl(d),cor:R.BAD},{v:brl(e-d),cor:e-d<0?R.BAD:R.OK,b:true}]}}));
    R.sub(`Total ${y}${y===hm.slice(0,4)?' até hoje':''}: ${brl(tE)} − ${brl(tD)}`,brl(tE-tD),tE-tD<0?R.BAD:R.OK);
    exportaRel(R,`Finanças · ${MesCap(m)}`,`financas-${m}`,`*${NOME} · Finanças ${nomeMes(m)}*\n\nEntrou: ${brl(ent)}\nSaiu: ${brl(sai)}\nResultado do mês: ${brl(ent-sai)}\n*Saldo em caixa: ${brl(saldo)}*\nA receber: ${brl(soma(dev,g=>g.total))}`);
  }else if(k==='receitas'){
    const rs=receitasMes(m).sort((a,b)=>a.data.localeCompare(b.data)),c=cfgMes(m),t=x=>soma(rs.filter(r=>r.tipo===x),r=>r.valor);
    R.kpis([['Entrou no mês',brl(soma(rs,r=>r.valor)),R.OK],['Lançamentos',String(rs.length)],['Mensalidades',brl(t('mensalidade'))],['Diárias',brl(t('diaria'))],['Avulsas',brl(t('avulsa'))],['Valores do mês',`${brl(c.mensalidade)} / ${brl(c.diaria)}`]]);
    R.nota(`Mensalidade ${brl(c.mensalidade)} (vence dia ${c.vencimento}) · diária ${brl(c.diaria)}.`);
    [['mensalidade','Mensalidades recebidas'],['diaria','Diárias recebidas'],['avulsa','Receitas avulsas']].forEach(([tp,tit])=>{
      const a=rs.filter(r=>r.tipo===tp);R.sec(`${tit} · ${a.length}`);
      if(!a.length)return R.vazio('Nenhuma.');
      a.forEach(r=>{const[l,b]=labelRec(r);R.linha(tp==='avulsa'?l:nomeJ(r.jogadorId),(tp==='mensalidade'?l+' · ':tp==='diaria'?'pelada '+dataBR(r.data)+' · ':'')+'recebido '+dataBR(r.data),brl(r.valor),R.OK)});
      R.sub('Subtotal',brl(soma(a,r=>r.valor)),R.OK);
    });
    relDevedores(R,m);
    exportaRel(R,`Receitas · ${MesCap(m)}`,`receitas-${m}`,`*${NOME} · Receitas ${nomeMes(m)}*\n\nMensalidades: ${brl(t('mensalidade'))}\nDiárias: ${brl(t('diaria'))}\nAvulsas: ${brl(t('avulsa'))}\n*Total: ${brl(soma(rs,r=>r.valor))}*`);
  }else if(k==='despesas'){
    const ds=despesasMes(m).sort((a,b)=>a.dt.localeCompare(b.dt)),tot=soma(ds,x=>x.valor);
    const cats={};ds.forEach(x=>cats[x.d.categoria]=(cats[x.d.categoria]||0)+x.valor);
    R.kpis([['Saiu no mês',brl(tot),R.BAD],['Lançamentos',String(ds.length)]]);
    R.sec('Por categoria');
    const ca=Object.entries(cats).sort((a,b)=>b[1]-a[1]);ca.length?ca.forEach(([l,v])=>R.linha(l,null,brl(v),R.BAD)):R.vazio('Nada lançado.');
    R.sec('Dia a dia');
    const dias={};ds.forEach(x=>(dias[x.dt]=dias[x.dt]||[]).push(x));
    const tl={avista:'à vista',parcelada:'parcela',recorrente:'recorrente'};
    Object.entries(dias).forEach(([dt,a])=>{R.sub(`${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(dt+'T12:00:00').getDay()]}, ${dataBR(dt)}`,brl(soma(a,x=>x.valor)),R.BAD);
      a.forEach(x=>R.linha(x.d.descricao||x.d.categoria,`${x.d.categoria} · ${x.d.tipo==='parcelada'?x.lab:tl[x.d.tipo]}${x.d.peladaId?' · despesa da pelada':''}`,brl(x.valor),R.BAD))});
    if(!ds.length)R.vazio('Nada lançado nesse mês.');
    const fx=DB.despesas.filter(d=>d.tipo!=='avista');
    if(fx.length){R.sec('Fixas e parceladas');fx.forEach(d=>{const v=d.tipo==='recorrente'?(lastBy(d.vigencias,m)||d.vigencias[d.vigencias.length-1]).valor:d.valor/d.parcelas;
      R.linha(d.descricao||d.categoria,d.tipo==='recorrente'?`${d.categoria} · recorrente${d.fim?' até '+nomeMesC(d.fim):''}`:`${d.categoria} · ${d.parcelas}x · 1ª em ${nomeMesC(ym(d.data))}`,brl(v)+(d.tipo==='recorrente'?'/mês':'/parc.'),R.TX)})}
    R.sub('Total do mês',brl(tot),R.BAD);
    exportaRel(R,`Despesas · ${MesCap(m)}`,`despesas-${m}`,`*${NOME} · Despesas ${nomeMes(m)}*\n\n`+ca.map(([l,v])=>`${l}: ${brl(v)}`).join('\n')+`\n\n*Total: ${brl(tot)}*`);
  }else{
    const y=S.pgAno||ym(hoje()).slice(0,4),hm=ym(hoje()),ms=mesesAno(y);
    const jogs=DB.jogadores.filter(j=>ms.some(x=>x<=hm&&tipoMes(j,x)==='mensalista'&&(!j.entrada||x>=ym(j.entrada)))).sort(byNome);
    let pago=0,aberto=0,nDev=0;
    const linhas=jogs.map(j=>{const cels=ms.map(x=>statusPag(j,x));let d=0;cels.forEach((st,i)=>{const v=cfgMes(ms[i]).mensalidade;if(st==='ok'){const r=DB.receitas.find(r=>r.tipo==='mensalidade'&&r.jogadorId===j.id&&r.competencia===ms[i]);pago+=r?+r.valor:v}if(st==='dv'){aberto+=v;d+=v}});if(d)nDev++;
      return{nome:j.apelido||j.nome,sub:d?'deve '+brl(d):(tipoMes(j,hm)==='isento'?'isento':tipoMes(j,hm)!=='mensalista'?'saiu':'em dia'),cels,d}});
    R.kpis([['Mensalidades pagas',brl(pago),R.OK],['Em aberto',brl(aberto),aberto?R.BAD:R.TX],['Mensalistas',String(jogs.length)],['Devendo',String(nDev),nDev?R.BAD:R.TX]]);
    R.sec(`Mensalidades ${y}`);
    jogs.length?R.grade(ms,linhas):R.vazio('Nenhum mensalista nesse ano.');
    const dev=linhas.filter(l=>l.d).sort((a,b)=>b.d-a.d);
    if(dev.length){R.sec('Em aberto por jogador');dev.forEach(l=>R.linha(l.nome,ms.filter((x,i)=>l.cels[i]==='dv').map(nomeMesC).join(' · '),brl(l.d),R.BAD));R.sub('Total em aberto',brl(aberto),R.BAD)}
    R.nota('Só mensalistas. Diárias aparecem na lista de devedores do mês.');
    exportaRel(R,`Mensalidades ${y}`,`mensalidades-${y}`,`*${NOME} · Mensalidades ${y}*\n\nPagas: ${brl(pago)}\nEm aberto: ${brl(aberto)}`+(dev.length?'\n\n'+dev.map(l=>`${l.nome}: ${brl(l.d)}`).join('\n'):''));
  }
}
function vFinGeral(){
  const m=S.mes,rs=receitasMes(m),ds=despesasMes(m);
  const ent=soma(rs,r=>r.valor),sai=soma(ds,x=>x.valor),res=ent-sai,saldo=saldoAte(m);
  const dev=agrupaDev(m),pendV=soma(dev,g=>g.total);
  const tipos=[['mensalidade','Mensalidades'],['diaria','Diárias'],['avulsa','Avulsas']].map(([k,l])=>[l,soma(rs.filter(r=>r.tipo===k),r=>r.valor)]).filter(x=>x[1]);
  const cats={};ds.forEach(x=>cats[x.d.categoria]=(cats[x.d.categoria]||0)+x.valor);
  const barras=(arr,cor)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return arr.length?arr.map(([l,v])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between;font-size:14px"><span>${esc(l)}</span><b>${brl(v)}</b></div><div style="height:6px;border-radius:4px;background:var(--line);margin-top:4px"><div style="height:6px;border-radius:4px;width:${(v/mx*100).toFixed(1)}%;background:${cor}"></div></div></div>`).join(''):'<div class="empty">Nada no mês.</div>'};
  const y=m.slice(0,4);let tE=0,tD=0;
  const hm=ym(hoje());
  const hist=mesesAno(y).map(x=>{const e=soma(receitasMes(x),r=>r.valor),d=soma(despesasMes(x),z=>z.valor);
    if(x>hm)return `<tr style="opacity:.55;font-style:italic"><td style="text-transform:capitalize">${nomeMesC(x)}</td><td>—</td><td>${d?brl(d):'—'}</td><td style="font-size:11px">previsto</td></tr>`;
    tE+=e;tD+=d;
    return `<tr${x===m?' style="background:var(--pri2)"':''}><td style="text-transform:capitalize">${nomeMesC(x)}</td><td class="pos">${brl(e)}</td><td class="neg">${brl(d)}</td><td class="${e-d>=0?'pos':'neg'}"><b>${brl(e-d)}</b></td></tr>`}).join('')
    +`<tr style="border-top:2px solid var(--line)"><td><b>Total ${y}${y===hm.slice(0,4)?' até hoje':''}</b></td><td class="pos"><b>${brl(tE)}</b></td><td class="neg"><b>${brl(tD)}</b></td><td class="${tE-tD>=0?'pos':'neg'}"><b>${brl(tE-tD)}</b></td></tr>`;
  return `${mesBar()}
  <div class="kpis"><div class="kpi"><small>Saldo em caixa</small><b class="${saldo>=0?'pos':'neg'}">${brl(saldo)}</b></div><div class="kpi"><small>Resultado do mês</small><b class="${res>=0?'pos':'neg'}">${brl(res)}</b></div>
  <div class="kpi click" onclick="S.fin='receitas';render()"><small>Entrou ›</small><b>${brl(ent)}</b></div><div class="kpi click" onclick="S.fin='despesas';render()"><small>Saiu ›</small><b>${brl(sai)}</b></div></div>
  <div class="card click" onclick="telaDevedores()"><div class="row" style="justify-content:space-between"><div><small class="empty" style="padding:0">A receber · ${dev.length} devendo</small><div class="slab ${pendV?'neg':''}" style="font-size:20px">${brl(pendV)}</div></div><span class="tag ${dev.length?'b':''}">ver lista ›</span></div></div>
  <div class="card"><h3>Entradas por tipo</h3>${barras(tipos,'var(--ok)')}</div>
  <div class="card"><h3>Saídas por categoria</h3>${barras(Object.entries(cats).sort((a,b)=>b[1]-a[1]),'var(--bad)')}</div>
  <div class="card"><h3>Ano de ${y}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="color:var(--mut);text-align:left"><th>Mês</th><th>Entrou</th><th>Saiu</th><th>Resultado</th></tr></thead><tbody>${hist}</tbody></table></div></div>`;
}

function vPag(){
  const y=S.pgAno||ym(hoje()).slice(0,4),hm=ym(hoje()),ms=mesesAno(y);
  const jogs=DB.jogadores.filter(j=>ms.some(m=>m<=hm&&tipoMes(j,m)==='mensalista'&&(!j.entrada||m>=ym(j.entrada)))).sort(byNome);
  const desde=j=>{if(j.entrada)return dataBR(j.entrada).slice(0,6)+j.entrada.slice(2,4);const t=[...(j.tipos||[])].filter(x=>x.tipo==='mensalista').sort((a,b)=>a.desde.localeCompare(b.desde))[0];return t&&t.desde>'2000-01'?nomeMesC(t.desde):''};
  let devTot=0;
  const cel=(j,m)=>{
    if(m>hm)return `<td></td>`;
    const c=cfgMes(m);
    if(tipoMes(j,m)==='mensalista'){
      if(DB.receitas.some(r=>r.tipo==='mensalidade'&&r.jogadorId===j.id&&r.competencia===m))return `<td title="pago"><i class="dt ok"></i></td>`;
      if(j.ativo===false||!deveMes(j,m))return `<td title="${deveMes(j,m)?'inativo':'ainda não devia'}"><i class="dt na"></i></td>`;
      if(!(c.mensalidade>0))return `<td title="mensalidade sem valor nesse mês"><i class="dt na"></i></td>`;
      const venc=`${m}-${p2(c.vencimento)}`;
      if(hoje()>venc){devTot+=c.mensalidade;return `<td title="devendo"><i class="dt dv"></i></td>`}
      return `<td title="a vencer"><i class="dt av"></i></td>`;
    }
    if(tipoMes(j,m)==='isento')return `<td title="isento"><i class="dt is"></i></td>`;
    return `<td title="não era mensalista"><i class="dt na"></i></td>`;
  };
  const rows=jogs.map(j=>`<tr><th class="pg-n click" onclick="detJog('${j.id}')">${esc(j.apelido||j.nome)}<small>${desde(j)?'desde '+desde(j):''}${tipoMes(j,hm)==='isento'?' · isento':tipoMes(j,hm)!=='mensalista'?' · saiu':''}</small></th>${ms.map(m=>cel(j,m)).join('')}</tr>`).join('');
  return `<h3 class="slab" style="margin:4px 0 10px;font-size:17px;line-height:1.25">Mensalidades mês a mês</h3>
  <div class="mes"><button class="btn sm ghost" onclick="S.pgAno='${+y-1}';render()">‹</button><b>${y}</b><button class="btn sm ghost" onclick="S.pgAno='${+y+1}';render()">›</button></div>
  <div class="card" style="padding:0;overflow:hidden">${jogs.length?`<table class="pg"><thead><tr><th class="pg-n"></th>${ms.map(m=>`<th${m===hm?' class="pg-hj"':''}>${MESES[+m.slice(5)-1][0].toUpperCase()}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty" style="padding:14px">Nenhum mensalista nesse ano.</div>'}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><span class="empty" style="padding:0">Mensalidades em aberto em ${y}</span><b class="${devTot?'neg':'pos'} slab" style="font-size:18px">${brl(devTot)}</b></div>
  <div class="empty" style="font-size:12px;margin-top:6px"><span class="leg"><i class="dt ok"></i>pago</span><span class="leg"><i class="dt dv"></i>devendo</span><span class="leg"><i class="dt av"></i>a vencer</span><span class="leg"><i class="dt is"></i>isento</span><span class="leg"><i class="dt na"></i>não devia</span><br>Só mensalistas. Diárias ficam na lista de devedores.</div></div>`;
}
const RANKS={
  g:{t:'⚽ Artilharia',f:x=>x.g,fmt:x=>x.g+(x.g===1?' gol':' gols')},
  c:{t:'🟨🟦🟥 Cartões',f:x=>totCart(x)*1e9+(x.cv||0)*1e6+(x.cz||0)*1e3+(x.ca||0),fmt:x=>`${x.ca} 🟨 · ${x.cz||0} 🟦 · ${x.cv} 🟥`},
  p:{t:'📅 Presenças / Jogos',f:x=>S.pj==='jg'?x.jg:x.pr,fmt:x=>`${x.pr} pres. · ${x.jg} jogo${x.jg===1?'':'s'}`}
};
// presenças x jogos: chips para trocar a ordem e tabela com as duas colunas
const chipsPJ=onc=>`<div class="pjseg">${[['pr','Presenças'],['jg','Jogos']].map(([k,l])=>`<button class="chip ${S.pj===k?'on':''}" onclick="event.stopPropagation();S.pj='${k}';${onc}">${l}</button>`).join('')}</div>`;
function tabPJ(rk,n){
  const f=x=>S.pj==='jg'?x.jg:x.pr,o=x=>S.pj==='jg'?x.pr:x.jg;
  const arr=rk.filter(x=>x.pr||x.jg).sort((a,b)=>f(b)-f(a)||o(b)-o(a)||nomeJ(a.id).localeCompare(nomeJ(b.id),'pt-BR'));
  let pos=0,prev=null;
  const rows=arr.map((x,i)=>{const v=f(x);if(v!==prev){pos=i+1;prev=v}return{x,pos}}).slice(0,n||1e9).map(({x,pos})=>{
    const med=n?'':(({1:'🥇',2:'🥈',3:'🥉'})[pos]||'');
    return `<tr><td class="z">${pos}º</td><td class="tn">${med} ${esc(nomeJ(x.id))}</td><td class="${S.pj==='pr'?'on':''}">${x.pr}</td><td class="${S.pj==='jg'?'on':''}">${x.jg}</td></tr>`}).join('');
  return rows?`<table class="tpj"><thead><tr><th></th><th class="tn">Jogador</th><th class="${S.pj==='pr'?'on':''}">Presenças</th><th class="${S.pj==='jg'?'on':''}">Jogos</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Sem dados.</div>';
}
function rankCompleto(k){
  if(k==='p'){
    const rk=ranking(perRk());
    return modal(`<h3>📅 Presenças / Jogos</h3><p class="empty" style="margin-top:0;text-transform:capitalize">${perNome()} · empate divide a posição</p>
    ${chipsPJ("rankCompleto('p')")}
    <div class="empty" style="font-size:12px;padding:2px 0 6px">Presenças = peladas em que esteve na lista · Jogos = partidas que entrou em campo.</div>
    ${tabPJ(rk)}
    <button class="btn ghost" style="margin-top:16px;width:100%" onclick="fecha()">Fechar</button>`);
  }
  const R=RANKS[k],per=perNome();
  const arr=ranking(perRk()).sort((a,b)=>R.f(b)-R.f(a)||b.pr-a.pr||nomeJ(a.id).localeCompare(nomeJ(b.id),'pt-BR'));
  let pos=0,prev=null;
  const rows=arr.map((x,i)=>{const v=R.f(x);if(v!==prev){pos=i+1;prev=v}
    const med=v>0?({1:'🥇',2:'🥈',3:'🥉'}[pos]||''):'';
    return `<div class="rk"><span><b style="display:inline-block;min-width:34px">${pos}º</b>${med} ${esc(nomeJ(x.id))}</span><b>${R.fmt(x)}</b></div>`}).join('');
  modal(`<h3>${R.t}</h3><p class="empty" style="margin-top:0;text-transform:capitalize">${per} · ${arr.length} jogador(es) · empate divide a posição</p>
  ${rows||'<div class="empty">Sem dados nesse período.</div>'}
  <button class="btn ghost" style="margin-top:16px;width:100%" onclick="fecha()">Fechar</button>`);
}

// ----- login -----
function loginForm(){modal(`<h3>Entrar como admin</h3><label>E-mail</label><input id="lgE" type="email" autocomplete="username"><label>Senha</label><input id="lgS" type="password" autocomplete="current-password">${botoesModal('entrar()')}`)}
async function entrar(){
  const{error}=await sb.auth.signInWithPassword({email:val('lgE'),password:val('lgS')});
  if(error)return avisa('Não entrou: '+error.message);
  const{data:{session}}=await sb.auth.getSession();await buscaPapel(session);fecha();
  if(!papel)avisa('Login feito, mas esse usuário não é ADM nem juiz: só visualiza.');render();
}
async function sair(){await sb.auth.signOut();setPapel(null);go('inicio')}

// ===== jogadores de teste (entram uma vez só) =====
async function seedTeste(){
  if(!isAdmin)return;
  // renomeia categorias antigas (seguro rodar sempre)
  for(const d of DB.despesas)if(CAT_ANTIGA[d.categoria])await put('despesas',{...d,categoria:CAT_ANTIGA[d.categoria]});

}
async function zeraTudo(){
  const n={j:DB.jogadores.length,p:DB.peladas.length,r:DB.receitas.length,d:DB.despesas.length};
  if(!n.j&&!n.p&&!n.r&&!n.d)return avisa('Não há dados para apagar.');
  if(!await confirma(`Apagar TUDO: ${n.j} jogador(es), ${n.p} pelada(s), ${n.r} receita(s) e ${n.d} despesa(s)? Configurações, logo e cores continuam.`,'Continuar'))return;
  if(!await confirma('Última chance: isso não tem volta. Apagar mesmo?','Apagar tudo'))return;
  for(const col of ['receitas','despesas','peladas','jogadores'])for(const x of [...DB[col]])await del(col,x.id);
  S.sorteio={sel:[],res:null};S.peladaId=null;
  await avisa('Pronto, dados apagados. Pode começar a pelada de verdade!');go('inicio');
}
async function zeraDespesas(){
  if(!DB.despesas.length)return avisa('Não há despesas lançadas.');
  if(!await confirma(`Apagar TODAS as ${DB.despesas.length} despesas (inclusive as do dia das peladas)? Não tem volta.`,'Apagar tudo'))return;
  for(const d of [...DB.despesas])await del('despesas',d.id);
  avisa('Despesas apagadas.');render();
}
async function apagaTeste(){
  const ids=new Set(DB.jogadores.filter(j=>j.teste).map(j=>j.id));
  if(!ids.size)return avisa('Não há jogadores de teste.');
  if(!await confirma(`Apagar ${ids.size} jogadores de teste e tudo que foi lançado pra eles (presenças, gols, cartões, pagamentos)?`))return;
  for(const r of DB.receitas.filter(r=>ids.has(r.jogadorId)))await del('receitas',r.id);
  for(const p of DB.peladas){
    const pr=(p.presentes||[]).filter(id=>!ids.has(id));
    if(pr.length!==(p.presentes||[]).length||Object.keys(p.stats||{}).some(id=>ids.has(id))){
      const st={};Object.entries(p.stats||{}).forEach(([k,v])=>{if(!ids.has(k))st[k]=v});
      await put('peladas',{...p,presentes:pr,stats:st});
    }
  }
  for(const id of ids)await del('jogadores',id);
  S.sorteio={sel:[],res:null};avisa('Jogadores de teste apagados.');render();
}
testaStorage();load().then(seedTeste).then(render);
